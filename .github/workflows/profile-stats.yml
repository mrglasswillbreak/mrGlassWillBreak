name: Refresh profile graphics

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check graphics generator
        run: node --test scripts/update-stats.test.mjs
      - name: Refresh from GitHub
        run: node scripts/update-stats.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save updated graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh GitHub profile graphics'
          git pull --rebase origin main
          git push origin HEAD:main
