<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Muhammed Abdulhadi — Full-stack developer</title>
  <desc id="desc">Thoughtful design. Useful things. Based in Lagos, building for the web.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#283025" stroke-width="1"/></pattern>
  </defs>
  <style>
    .cursor { animation: breathe 4s ease-in-out infinite; }
    .code-left { animation: drift-left 8s ease-in-out infinite; }
    .code-right { animation: drift-right 8s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes drift-left { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-5px); } }
    @keyframes drift-right { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    @media (prefers-reduced-motion: reduce) { .cursor,.code-left,.code-right { animation: none !important; } }
  </style>
  <rect width="1000" height="300" rx="18" fill="#101510"/>
  <rect x="690" width="310" height="300" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="49" fill="#d3ef93" font-size="13" letter-spacing="2.5">MUHAMMED ABDULHADI / FULL-STACK DEVELOPER</text>
    <text x="39" y="123" fill="#eeefe7" font-size="49" font-weight="600" letter-spacing="-2">Thoughtful design.</text>
    <text x="39" y="182" fill="#d3ef93" font-family="Georgia, serif" font-style="italic" font-size="54" letter-spacing="-2">Useful things.</text>
    <path d="M42 218H636" stroke="#30392c"/>
    <text x="42" y="255" fill="#a4afa0" font-size="16">Lagos, Nigeria</text>
    <circle cx="164" cy="250" r="3" fill="#d3ef93"/>
    <text x="180" y="255" fill="#a4afa0" font-size="16">Interfaces, systems, and the details between.</text>
  </g>
  <g transform="translate(722 63)">
    <rect width="236" height="174" rx="12" fill="#172017" stroke="#46523b"/>
    <path d="M0 35H236" stroke="#46523b"/>
    <circle class="cursor" cx="18" cy="18" r="4" fill="#d3ef93"/><circle cx="33" cy="18" r="4" fill="#7c9f54"/><circle cx="48" cy="18" r="4" fill="#50663d"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
      <path class="code-left" d="m70 77-24 25 24 25" stroke="#d3ef93"/>
      <path class="code-right" d="m166 77 24 25-24 25" stroke="#d3ef93"/>
      <path class="cursor" d="m131 68-27 68" stroke="#8db8ef"/>
    </g>
  </g>
</svg>
